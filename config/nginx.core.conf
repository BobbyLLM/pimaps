server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /srv/maps/web;
    index index.html;
    sendfile on;
    client_max_body_size 0;
    location ~* ^/(.*\.(?:mjs|js))$ { default_type application/javascript; try_files $uri =404; }
    location = /api/route { proxy_pass http://brouter:17777/brouter; proxy_connect_timeout 5s; proxy_read_timeout 60s; }
    location = /api/search { proxy_pass http://search:8787/search; proxy_connect_timeout 5s; proxy_read_timeout 10s; }
    location /api/wiki/ { proxy_pass http://search:8787/wiki/; proxy_connect_timeout 5s; proxy_read_timeout 15s; }
    location ~* ^/maps/(.*\.(?:mjs|js))$ { rewrite ^/maps/(.*)$ /$1 break; default_type application/javascript; try_files $uri =404; }
    location /maps/ { rewrite ^/maps/?(.*)$ /$1 break; try_files $uri $uri/ /index.html; }
    location /data/ { add_header Accept-Ranges bytes always; alias /srv/maps/data/; }
    location / { try_files $uri $uri/ /index.html; }
}
