<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Maps</title>
<link rel="stylesheet" href="./maplibre-gl.css">
<style>
html,body,#map{margin:0;width:100%;height:100%}#map{position:absolute}.panel{position:absolute;z-index:2;top:12px;left:12px;width:510px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);box-sizing:border-box;overflow:auto;overflow-x:hidden;padding:10px 44px 10px 10px;background:#fffffff5;border-radius:8px;box-shadow:0 1px 5px #0004;font:14px system-ui}.panel h1{font-size:16px;margin:0 0 5px}.panel input{box-sizing:border-box;width:100%;margin:3px 0;padding:7px}.panel button{box-sizing:border-box;margin:3px 3px 3px 0;padding:6px}.sidebar-collapse,.sidebar-restore{z-index:3;border:1px solid #64748b;border-radius:6px;background:#f8fafc;color:#0f172a;font:bold 20px/1 system-ui;cursor:pointer}.sidebar-collapse{position:absolute;top:8px;right:8px;width:30px;height:30px}.sidebar-restore{position:absolute;top:12px;left:8px;width:34px;height:38px}.sidebar-collapse:hover,.sidebar-collapse:focus,.sidebar-restore:hover,.sidebar-restore:focus{background:#e2e8f0}.result{padding:6px 2px;border-top:1px solid #ddd;cursor:pointer;font-size:12px}.status{font-size:12px;color:#555}.download{display:inline-block;margin:6px 0;color:#075985}.route{border-top:1px solid #ddd;margin-top:8px;padding-top:8px}.route-results{margin:0 0 4px}.route-results .result{background:#fff}.resolved{color:#166534;font-size:12px}.unresolved{color:#92400e;font-size:12px}.wiki-popup{max-width:320px;max-height:260px;overflow:auto;font:13px system-ui}.wiki-popup h3{margin:0 0 6px;font-size:16px}.wiki-popup p{margin:0 0 8px;line-height:1.35}.wiki-popup a{color:#075985}.wiki-read{display:inline-block;margin-top:4px}.layers-button{display:block;width:100%;margin:9px 0 4px;padding:8px 10px;border:1px solid #64748b;border-radius:6px;background:#f8fafc;color:#0f172a;font-weight:700;text-align:left;cursor:pointer}.layers-button:hover,.layers-button:focus{background:#e2e8f0}.layers-panel{padding:6px 8px;margin-bottom:5px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc}.layers-panel label{display:block;cursor:pointer}.layers-panel input{vertical-align:middle}@media(max-width:600px){.panel{left:8px;right:8px;width:auto;max-width:none;max-height:calc(100vh - 16px);padding:8px}.sidebar-collapse,.sidebar-restore{display:none}.layers-button{font-size:14px}}
</style>
</head>
<body>
<div id="map"></div>
<section class="panel"><button id="sidebarCollapse" class="sidebar-collapse" type="button" aria-label="Collapse map controls" title="Collapse map controls">?</button><h1 id="appTitle">Pi Maps</h1>
<div>Local offline map, search, and driving routes.</div>
<a id="mapDownload" class="download" href="./data/map.pmtiles" download="map.pmtiles">Download map.pmtiles</a>
<input id="search" placeholder="Search local places..." aria-label="Search local places"><div id="results"></div>
<div class="route"><b>Route</b>
<input id="from" placeholder="From address or place" autocomplete="off"><div id="fromResults" class="route-results"></div><div id="fromState" class="status"></div>
<button id="gps">Use current location</button>
<input id="to" placeholder="To address or place" autocomplete="off"><div id="toResults" class="route-results"></div><div id="toState" class="status"></div>
<button id="plan">Plan driving route</button><div id="info" class="status"></div><ol id="instructions"></ol>
</div><button id="layersButton" class="layers-button" type="button" aria-expanded="false" aria-controls="layersPanel">Layers</button><div id="layersPanel" class="layers-panel" hidden><label><input id="wikiToggle" type="checkbox" style="width:auto;margin-right:5px">Wikipedia places <span style="font-size:11px;color:#666">(local)</span></label></div><div id="status" class="status">Loading map...</div></section><button id="sidebarRestore" class="sidebar-restore" type="button" aria-label="Show map controls" title="Show map controls" hidden>?</button><script>(function(){var panel=document.querySelector(".panel"),collapse=document.getElementById("sidebarCollapse"),restore=document.getElementById("sidebarRestore"),layers=document.getElementById("layersButton"),layersPanel=document.getElementById("layersPanel"),key="pi-maps-sidebar-collapsed";if(!panel||!collapse||!restore)return;function mobile(){return window.matchMedia("(max-width:600px)").matches}function apply(isCollapsed){var c=!!isCollapsed&&!mobile();panel.hidden=c;restore.hidden=!c;collapse.hidden=mobile();collapse.setAttribute("aria-expanded",String(!c));}var saved="0";try{saved=localStorage.getItem(key)||"0"}catch(e){}apply(saved==="1");collapse.addEventListener("click",function(){if(mobile())return;try{localStorage.setItem(key,"1")}catch(e){}apply(true)});restore.addEventListener("click",function(){try{localStorage.setItem(key,"0")}catch(e){}apply(false)});if(window.matchMedia){window.matchMedia("(max-width:600px)").addEventListener?.("change",function(){var s="0";try{s=localStorage.getItem(key)||"0"}catch(e){}apply(s==="1")})}if(layers&&layersPanel&&!layers.dataset.bound){layers.dataset.bound="1";layers.addEventListener("click",function(){var show=layersPanel.hidden;layersPanel.hidden=!show;layers.setAttribute("aria-expanded",String(show));})}})();</script>
<script src="./pmtiles.js"></script><script src="./basemaps.js"></script>
<script type="module">
import * as maplibregl from './maplibre-gl.mjs';
const base=new URL('.',location.href).href,st=document.getElementById('status'),res=document.getElementById('results'),q=document.getElementById('search'),fr=document.getElementById('from'),to=document.getElementById('to'),info=document.getElementById('info'),ins=document.getElementById('instructions'),proto=new window.pmtiles.Protocol();
maplibregl.addProtocol('pmtiles',proto.tile);
const edition=await (await fetch('./data/edition.json')).json(),editionName=edition.edition_name||edition.edition_id||'Pi Maps',mapMeta=edition.map||{},mapFile=mapMeta.filename||'map.pmtiles',mapCenter=mapMeta.default_center||[0,0],mapZoom=mapMeta.default_zoom??2;document.title='Pi Maps - '+editionName;document.getElementById('appTitle').textContent='Pi Maps - '+editionName;document.getElementById('search').setAttribute('placeholder','Search '+editionName+'...');document.getElementById('search').setAttribute('aria-label','Search '+editionName);const mapDownload=document.getElementById('mapDownload');mapDownload.href='./data/'+mapFile;mapDownload.download=mapFile;mapDownload.textContent='Download '+mapFile;
const map=new maplibregl.Map({container:'map',center:mapCenter,zoom:mapZoom,minZoom:0,maxZoom:15,style:{version:8,glyphs:base+'assets/fonts/{fontstack}/{range}.pbf',sprite:base+'assets/sprites/v4/light',sources:{protomaps:{type:'vector',url:'pmtiles://'+base+'data/'+mapFile,attribution:'OpenStreetMap contributors - Protomaps'}},layers:window.basemaps.layers('protomaps',window.basemaps.namedFlavor('light'),{lang:'en'})},attributionControl:true});
let wikiOn=false;let wikiPopup=null;function wikiEsc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadWiki(){if(!wikiOn)return;const b=map.getBounds(),url='./api/wiki/pois?bbox='+[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',');try{const d=await (await fetch(url)).json();const src=map.getSource('wiki');if(src)src.setData(d);else{map.addSource('wiki',{type:'geojson',data:d,cluster:true,clusterMaxZoom:10,clusterRadius:48});map.addLayer({id:'wiki-clusters',type:'circle',source:'wiki',filter:['has','point_count'],paint:{'circle-color':'#7c3aed','circle-radius':['step',['get','point_count'],14,20,18,100,24],'circle-stroke-color':'#fff','circle-stroke-width':2}});map.addLayer({id:'wiki-cluster-count',type:'symbol',source:'wiki',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':11},paint:{'text-color':'#fff'}});map.addLayer({id:'wiki-pois',type:'circle',source:'wiki',filter:['!',['has','point_count']],paint:{'circle-color':'#7c3aed','circle-radius':7,'circle-stroke-color':'#fff','circle-stroke-width':2}});map.on('click','wiki-clusters',e=>{const f=map.queryRenderedFeatures(e.point,{layers:['wiki-clusters']})[0];map.getSource('wiki').getClusterExpansionZoom(f.properties.cluster_id,(err,z)=>{if(!err)map.easeTo({center:f.geometry.coordinates,zoom:z})})});map.on('click','wiki-pois',async e=>{const p=e.features[0].properties,c=e.features[0].geometry.coordinates;wikiPopup?.remove();wikiPopup=new maplibregl.Popup({maxWidth:'340px'}).setLngLat(c).setHTML('<div class=wiki-popup><h3>'+wikiEsc(p.name||p.wikipedia_title)+'</h3><div>Loading local summary...</div></div>').addTo(map);try{const d=await (await fetch('./api/wiki/summary?osm_type='+encodeURIComponent(p.osm_type)+'&osm_id='+encodeURIComponent(p.osm_id))).json();const lead=d.summary_available?d.lead_html:'<p>Wikipedia summary unavailable locally.</p>';wikiPopup.setHTML('<div class=wiki-popup><h3>'+wikiEsc(d.name||p.name)+'</h3>'+lead+'<a class=wiki-read href="'+wikiEsc(d.article_url)+'">Read full article</a></div>')}catch(x){wikiPopup.setHTML('<div class=wiki-popup><h3>'+wikiEsc(p.name)+'</h3><p>Wikipedia summary unavailable locally.</p></div>')}});}}catch(e){st.textContent='Wikipedia places unavailable locally.'}}window.addEventListener('beforeunload',()=>wikiPopup?.remove());
window.piMap=map;map.addControl(new maplibregl.NavigationControl(),'top-right');map.addControl(new maplibregl.FullscreenControl(),'top-right');map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}),'top-right');map.on('load',()=>st.textContent='Map loaded. Search and route data are local to this Pi.');map.on('moveend',()=>{if(wikiOn)loadWiki()});document.getElementById('wikiToggle').onchange=e=>{wikiOn=e.target.checked;if(wikiOn){loadWiki()}else if(map.getSource('wiki'))map.getSource('wiki').setData({type:'FeatureCollection',features:[]})};
function mark(id,c,color){const d={type:'Feature',geometry:{type:'Point',coordinates:c},properties:{}};if(map.getSource(id))map.getSource(id).setData(d);else{map.addSource(id,{type:'geojson',data:d});map.addLayer({id,type:'circle',source:id,paint:{'circle-radius':7,'circle-color':color,'circle-stroke-color':'#fff','circle-stroke-width':2}})}}
function resultLabel(r){return r.display_label||[r.title,r.locality||r.context].filter(Boolean).join(', ')}
function choose(r,target,state,box){target.value=resultLabel(r);delete target.dataset.routeLon;delete target.dataset.routeLat;delete target.dataset.routeAnchorType;delete target.dataset.routeAnchorOsmType;delete target.dataset.routeAnchorOsmId;target.dataset.lon=r.lon;target.dataset.lat=r.lat;target.dataset.osmType=r.osm_type;target.dataset.osmId=r.osm_id;if(r.route_lon!=null&&r.route_lat!=null){target.dataset.routeLon=r.route_lon;target.dataset.routeLat=r.route_lat;target.dataset.routeAnchorType=r.route_anchor_type||'access point';target.dataset.routeAnchorOsmType=r.route_anchor_osm_type||'';target.dataset.routeAnchorOsmId=r.route_anchor_osm_id||''}target.dataset.resolved='true';state.textContent='Resolved locally';state.className='resolved';box.innerHTML='';const c=[r.lon,r.lat];map.flyTo({center:c,zoom:16});mark('selected',c,'#2563eb')}
function show(data,target,box,state){box.innerHTML='';if(!data.results.length){box.textContent='No local result found.';return}data.results.forEach(r=>{const d=document.createElement('div');d.className='result';d.textContent=resultLabel(r);d.onclick=()=>choose(r,target,state,box);box.appendChild(d)})}
async function queryLocal(text){const response=await fetch('./api/search?q='+encodeURIComponent(text));if(!response.ok)throw Error('search');return response.json()}
async function searchLocal(text,target){if(!text.trim())return;res.textContent='Searching local index...';try{show(await queryLocal(text),target,res,document.createElement('div'))}catch(e){res.textContent='Local search unavailable'}}
q.onkeydown=e=>{if(e.key==='Enter')searchLocal(q.value,to)};q.onchange=()=>searchLocal(q.value,to);
function clearResolution(x,state,box){delete x.dataset.lon;delete x.dataset.lat;delete x.dataset.osmType;delete x.dataset.osmId;delete x.dataset.routeLon;delete x.dataset.routeLat;delete x.dataset.routeAnchorType;delete x.dataset.routeAnchorOsmType;delete x.dataset.routeAnchorOsmId;delete x.dataset.resolved;state.textContent='';box.innerHTML=''}
function attachRouteSearch(input,box,state){input.addEventListener('input',async()=>{clearResolution(input,state,box);if(!input.value.trim()){return}try{show(await queryLocal(input.value),input,box,state)}catch(e){box.textContent='Local search unavailable'}})}
attachRouteSearch(fr,document.getElementById('fromResults'),document.getElementById('fromState'));attachRouteSearch(to,document.getElementById('toResults'),document.getElementById('toState'));
document.getElementById('gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{const state=document.getElementById('fromState'),box=document.getElementById('fromResults');clearResolution(fr,state,box);fr.value='Current location';fr.dataset.lon=p.coords.longitude;fr.dataset.lat=p.coords.latitude;fr.dataset.resolved='true';state.textContent='Resolved from GPS';state.className='resolved'},()=>info.textContent='GPS unavailable. Use a typed start location.');
async function resolve(x,state){if(x.dataset.resolved==='true')return{canonical:[+x.dataset.lon,+x.dataset.lat],anchor:x.dataset.routeLon?[+x.dataset.routeLon,+x.dataset.routeLat]:null,anchorType:x.dataset.routeAnchorType||''};if(!x.value.trim())return null;const d=await queryLocal(x.value),r=d.results[0];if(!r){state.textContent='No local result found. This address is not in the current local data.';state.className='unresolved';return null}if(!r.auto_resolvable){state.textContent='Select a specific local result before routing.';state.className='unresolved';return null}choose(r,x,state,document.createElement('div'));return{canonical:[r.lon,r.lat],anchor:r.route_lon!=null&&r.route_lat!=null?[r.route_lon,r.route_lat]:null,anchorType:r.route_anchor_type||''}}
async function routeAttempt(a,b){const u='./api/route?lonlats='+a.join(',')+'|'+b.join(',')+'&profile=car-vario&format=geojson&timode=1',response=await fetch(u),body=await response.text();let g=null;try{g=JSON.parse(body)}catch(e){}return{response,g,feature:g&&g.features&&g.features[0],noTrack:response.status===400&&/(no track found|island detected)/i.test(body),url:u}}
document.getElementById('plan').onclick=async()=>{try{info.textContent='Resolving local locations...';ins.innerHTML='';const a=await resolve(fr,document.getElementById('fromState')),b=await resolve(to,document.getElementById('toState'));if(!a||!b){info.textContent='Enter or select both locations.';return}let attempt=await routeAttempt(a.canonical,b.canonical),used=[];const attempts=[[a.anchor,b.canonical,'from'],[a.canonical,b.anchor,'to'],[a.anchor,b.anchor,'both']];for(const [aa,bb,kind] of attempts){if(attempt.feature)break;if(!attempt.noTrack)break;if(!aa||!bb)continue;attempt=await routeAttempt(aa,bb);if(attempt.feature)used.push(kind)}if(!attempt.feature){info.textContent=attempt.noTrack?'No routable local access point found for this location.':'Route failed. Check local coverage and try again.';return}const f=attempt.feature,p=f.properties||{};const via=used.length?' · Routing via '+(used[0]==='both'?'selected entrances':used[0]==='from'?(a.anchorType||'access point'):(b.anchorType||'access point')):'';info.textContent=(+p['track-length']/1000).toFixed(1)+' km - Estimated time: '+Math.round(+p['total-time']/60)+' min'+via;if(map.getSource('route'))map.getSource('route').setData(f);else{map.addSource('route',{type:'geojson',data:f});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#dc2626','line-width':5}})}mark('start',a.canonical,'#16a34a');mark('destination',b.canonical,'#dc2626');const bb=new maplibregl.LngLatBounds();f.geometry.coordinates.forEach(c=>bb.extend(c));map.fitBounds(bb,{padding:80});function dist(m){m=+m;if(!isFinite(m)||m<1)return '';if(m<100)return Math.round(m)+' m';if(m<1000)return Math.round(m/10)*10+' m';return (m/1000).toFixed(m<10000?1:0)+' km'}function ord(n){return n===1?'first':n===2?'second':n===3?'third':n===4?'fourth':n+'th'}function turn(h){const c=+h[1],exit=Math.abs(+h[2]||0),names={1:'Continue straight',2:'Turn left',3:'Turn slightly left',4:'Turn sharply left',5:'Turn right',6:'Turn slightly right',7:'Turn sharply right',8:'Keep left',9:'Keep right',10:'Make a U-turn',11:'Make a U-turn',12:'Leave the route',13:'At the roundabout, take the '+ord(exit)+' exit',14:'At the roundabout, take the '+ord(exit)+' exit',15:'Make a U-turn',16:'Continue straight',17:'Exit left',18:'Exit right'};return names[c]||'Continue straight'}(p.voicehints||[]).forEach(h=>{const li=document.createElement('li'),d=dist(h[3]),t=turn(h);li.textContent=(d?'In '+d+', ':'')+t;ins.appendChild(li)});const arrival=document.createElement('li');arrival.textContent='Arrive at destination';ins.appendChild(arrival)}catch(e){info.textContent='Route failed. Check local coverage and try again.'}};
</script></body></html>
